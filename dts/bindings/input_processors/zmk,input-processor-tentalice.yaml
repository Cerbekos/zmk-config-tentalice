description: Tentalice runtime-configurable pointing input processor

compatible: "zmk,input-processor-tentalice"

properties:
  "#input-processor-cells":
    type: int
    const: 0
    description: Number of cells in input processor specifier

  mode:
    type: int
    required: true
    enum:
      - 0
      - 1
      - 2
      - 3
